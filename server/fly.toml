# Fly.io spec for the webhook service.
# Deploy from this directory:  fly launch --copy-config && fly deploy
# Then:                        fly secrets set WEBHOOK_SECRET="$(openssl rand -hex 32)"
app = "ns-inventory-hook"          # change to something globally unique
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "3000"
  MAX_SKEW_MS = "300000"
